name: Application checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile application modules
        run: python -m compileall -q app.py metrics.py prioritisation.py alerts.py
      - name: Smoke-test Streamlit app
        run: python -c "from streamlit.testing.v1 import AppTest; app = AppTest.from_file('app.py').run(); print('Streamlit exceptions:', len(app.exception)); assert len(app.exception) == 0"
